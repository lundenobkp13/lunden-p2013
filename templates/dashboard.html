<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lunden OBK P2013</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root{
  --g:#141f16;--gm:#1c2e20;--gc:rgba(255,255,255,.055);
  --lime:#a8e063;--lime2:#c6f135;--lime-dim:rgba(168,224,99,.15);
  --text:#eef2e6;--muted:rgba(238,242,230,.48);--border:rgba(168,224,99,.16);
  --win:#a8e063;--draw:#e0c870;--loss:#e07070;
  --blue:#7ec8e3;--orange:#f0a868;
  --r:12px;--tab-h:56px;--safe:env(safe-area-inset-bottom,0px)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--g);color:var(--text);
  min-height:100dvh;padding-bottom:calc(var(--tab-h) + var(--safe) + 8px);
  background-image:radial-gradient(ellipse 100% 40% at 50% 0%,#243d29 0%,transparent 55%)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 52px,rgba(255,255,255,.018) 52px,rgba(255,255,255,.018) 53px)}


/* ── Header ── */
.header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
  background:rgba(20,31,22,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hbadge{width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--lime),#5aad30);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 2px 12px rgba(168,224,99,.3)}
